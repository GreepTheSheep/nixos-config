name: CI

on:
  pull_request:
    branches:
      - unstable
    paths:
      - '**.nix'
  push:
    branches:
      - unstable
    paths:
      - '**.nix'
  workflow_dispatch:

concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Run deadnix
        run: nix run nixpkgs#deadnix .

      - name: Run statix
        run: nix run nixpkgs#statix -- check .

  flake-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check flake
        run: nix flake check -L

  discover-hosts:
    runs-on: ubuntu-latest
    outputs:
      hosts: ${{ steps.list.outputs.hosts }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: List hosts
        id: list
        run: |
          hosts=$(nix eval --json .#nixosConfigurations --apply builtins.attrNames)
          echo "$hosts"
          echo "hosts=$hosts" >> "$GITEA_OUTPUT"

  build-hosts:
    needs: discover-hosts
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        host: ${{ fromJson(needs.discover-hosts.outputs.hosts) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build host
        run: >
          nix build ".#nixosConfigurations.${{ matrix.host }}.config.system.build.toplevel"
          --dry-run --show-trace -L