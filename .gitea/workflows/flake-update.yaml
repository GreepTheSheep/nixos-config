name: Flake Update

on:
  schedule:
    # Every Friday at 19:12 UTC
    - cron: "12 19 * * 5"
  workflow_dispatch:

env:
  nixos-stable-version: "26.05"

jobs:
  update-unstable:
    strategy:
      matrix:
        ref:
          - unstable
          - stable
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: "${{ matrix.ref }}"
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix (unstable)
        uses: cachix/install-nix-action@v31
        if: ${{ matrix.ref == 'unstable' }}
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Install Nix (stable)
        if: ${{ matrix.ref == 'stable' }}
        uses: cachix/install-nix-action@v31
        with:
          nix_path: nixpkgs=channel:nixos-${{ env.nixos-stable-version }}

      - name: Update flake.lock
        run: nix flake update

      - name: Commit and push
        env:
          BOT_USERNAME: ${{ vars.ACTIONS_BOT }}
          BOT_TOKEN: ${{ secrets.ACTIONS_BOT_TOKEN }}
        run: |
          if git diff --quiet flake.lock; then
            echo "flake.lock is already up to date"
            exit 0
          fi

          git config user.name "$BOT_USERNAME"
          git config user.email "$BOT_USERNAME@users.noreply.gitea.com"
          git add flake.lock
          git commit -m "Flake update"

          git remote set-url origin "https://${BOT_USERNAME}:${BOT_TOKEN}@${GITHUB_SERVER_URL#https://}/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:${{ matrix.ref }}